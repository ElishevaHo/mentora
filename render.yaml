# Render Blueprint: creates the web service and a Postgres database in one click.
services:
  - type: web
    name: mentora
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mentora-db
          property: connectionString

databases:
  - name: mentora-db
    plan: free
